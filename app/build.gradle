plugins { id 'com.android.application' }

android {
    namespace 'com.smallmaocat.narutosenki'
    compileSdk 34

    defaultConfig {
        applicationId "com.smallmaocat.narutosenki"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.22-arm64"
        ndk { abiFilters 'arm64-v8a' }
    }

    // 依赖 AGP 默认路径 app/src/main/jniLibs/<abi>/*.so
    sourceSets {
        main {
            java.srcDirs   = ['src/main/java', 'src/main/cocos2dx-java']
            assets.srcDirs = ['src/main/assets']
        }
    }

    packaging {
        jniLibs { useLegacyPackaging = true }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    lint { abortOnError false }
}
dependencies { }
