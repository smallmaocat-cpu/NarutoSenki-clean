plugins { id 'com.android.application' }

android {
    namespace 'com.smallmaocat.narutosenki'
    compileSdk 34

    defaultConfig {
        applicationId "com.smallmaocat.narutosenki"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.22-clean"
        ndk { abiFilters 'armeabi-v7a' }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/libs']
            java.srcDirs   = ['src/main/java', 'src/main/cocos2dx-java']
            assets.srcDirs = ['src/main/assets']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    lint { abortOnError false }
}
dependencies { }
