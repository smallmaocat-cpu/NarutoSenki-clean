name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/cocos2d-x-2.2.2
            ~/android-ndk-r10e
            ~/tb
          key: ns-v6

      - name: 初始化
        run: |
          L=~/build.log
          echo "=== start ===" > $L
          cd ~
          if [ ! -d cocos2d-x-2.2.2/cocos2dx ]; then
            curl -fL --retry 5 --retry-all-errors -o cocos.zip \
              https://github.com/LeaderOnePro/NarutoSenki/releases/download/v1.22/cocos2d-x-2.2.2.zip
            unzip -q -o cocos.zip
          fi
          if [ ! -x android-ndk-r10e/ndk-build ]; then
            curl -fL --retry 5 --retry-all-errors -o ndk.zip \
              https://dl.google.com/android/repository/android-ndk-r10e-linux-x86_64.zip
            unzip -q -o ndk.zip
            chmod +x android-ndk-r10e/ndk-build
          fi
          echo "init done" >> $L

      - name: 编译 arm64 库
        run: |
          L=~/build.log
          NDK=~/android-ndk-r10e
          TC=$NDK/toolchains/aarch64-linux-android-4.9/prebuilt/linux-x86_64/bin
          export CC=$TC/aarch64-linux-android-gcc
          export AR=$TC/aarch64-linux-android-ar
          export RANLIB=$TC/aarch64-linux-android-ranlib
          export CHOST=aarch64-linux-android
          SR="--sysroot=$NDK/platforms/android-21/arch-arm64"
          export CFLAGS="-O2 -fPIC $SR"
          export CXXFLAGS="$CFLAGS"
          export LDFLAGS="$SR"
          mkdir -p ~/tb && cd ~/tb

          echo "@@@ zlib" >> $L
          if [ ! -f zlib/lib/libz.a ]; then
            curl -fsSL --retry 3 -o z.tgz https://github.com/madler/zlib/archive/refs/tags/v1.2.13.tar.gz
            tar xzf z.tgz; cd zlib-1.2.13
            sed -i 's|^CFLAGS=.*|CFLAGS=-O2 -fPIC|' configure
            ./configure --static --prefix=$HOME/tb/zlib > ~/z.log 2>&1
            make -j4 >> ~/z.log 2>&1 && make install >> ~/z.log 2>&1
            cd ..; tail -5 ~/z.log >> $L
          fi
          echo "zlib -> $(ls zlib/lib 2>/dev/null)" >> $L

          echo "@@@ libpng" >> $L
          if [ ! -f png/lib/libpng.a ]; then
            curl -fsSL --retry 3 -o p.tgz https://github.com/pnggroup/libpng/archive/refs/tags/v1.6.40.tar.gz
            tar xzf p.tgz; cd libpng-1.6.40
            ./configure --host=aarch64-linux-android --enable-static --disable-shared \
              --prefix=$HOME/tb/png --with-zlib-prefix=$HOME/tb/zlib > ~/p.log 2>&1
            make -j4 >> ~/p.log 2>&1 && make install >> ~/p.log 2>&1
            cd ..; tail -5 ~/p.log >> $L
          fi
          echo "png -> $(ls png/lib 2>/dev/null)" >> $L

          echo "@@@ libjpeg" >> $L
          if [ ! -f jpg/lib/libjpeg.a ]; then
            curl -fsSL --retry 3 -o j.tgz https://github.com/libjpeg-turbo/libjpeg-turbo/archive/refs/tags/1.5.3.tar.gz
            tar xzf j.tgz; cd libjpeg-turbo-1.5.3
            mkdir -p b && cd b
            cmake .. -DCMAKE_C_COMPILER=$CC -DCMAKE_AR=$AR -DCMAKE_RANLIB=$RANLIB \
              -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
              -DCMAKE_C_FLAGS="$CFLAGS" -DCMAKE_EXE_LINKER_FLAGS="$LDFLAGS" \
              -DCMAKE_INSTALL_PREFIX=$HOME/tb/jpg \
              -DENABLE_SHARED=OFF -DENABLE_STATIC=ON -DWITH_TURBOJPEG=OFF -DWITH_JAVA=OFF \
              -DWITH_SIMD=OFF > ~/j.log 2>&1
            make -j4 >> ~/j.log 2>&1 && make install >> ~/j.log 2>&1
            cd ../..; tail -8 ~/j.log >> $L
          fi
          echo "jpeg -> $(ls jpg/lib 2>/dev/null)" >> $L

          echo "@@@ 复制进 prebuilt" >> $L
          P=~/cocos2d-x-2.2.2/cocos2dx/platform/third_party/android/prebuilt
          for n in libpng png; do :; done
          mkdir -p $P/libpng/libs/arm64-v8a $P/libjpeg/libs/arm64-v8a
          cp ~/tb/png/lib/libpng.a   $P/libpng/libs/arm64-v8a/ 2>/dev/null && echo "png ok" >> $L
          cp ~/tb/png/lib/libpng16.a $P/libpng/libs/arm64-v8a/ 2>/dev/null
          cp ~/tb/png/lib/libpng*.a  $P/libpng/libs/arm64-v8a/ 2>/dev/null
          cp ~/tb/jpg/lib/libjpeg.a  $P/libjpeg/libs/arm64-v8a/ 2>/dev/null && echo "jpeg ok" >> $L
          ls -la $P/libpng/libs/arm64-v8a $P/libjpeg/libs/arm64-v8a >> $L 2>&1
          exit 0

      - name: 上报
        if: always()
        run: |
          { head -c 2000 ~/build.log; echo; echo "......"; tail -c 32000 ~/build.log; } > /tmp/t.log
          BODY=$(python3 -c 'import json;print(json.dumps(open("/tmp/t.log",errors="replace").read()))')
          curl -sS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" \
            -d "{\"title\":\"log ${{ github.run_number }}\",\"body\":$BODY}" \
            https://api.github.com/repos/${{ github.repository }}/issues || true
