name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Cache cocos + ndk
        uses: actions/cache@v4
        with:
          path: |
            ~/cocos2d-x-2.2.2
            ~/android-ndk-r10e
          key: ns-toolchain-v2

      - name: 下载 cocos2d-x 2.2.2
        run: |
          set -eo pipefail
          cd ~
          if [ ! -f cocos2d-x-2.2.2/CMakeLists.txt ] && [ ! -d cocos2d-x-2.2.2/cocos2dx ]; then
            curl -fL --retry 5 --retry-all-errors --retry-delay 5 -o cocos.zip \
              https://github.com/LeaderOnePro/NarutoSenki/releases/download/v1.22/cocos2d-x-2.2.2.zip
            unzip -q -o cocos.zip
          fi
          test -d ~/cocos2d-x-2.2.2/cocos2dx && echo "cocos ok"

      - name: 下载 NDK r10e
        run: |
          set -eo pipefail
          cd ~
          if [ ! -x android-ndk-r10e/ndk-build ]; then
            curl -fL --retry 5 --retry-all-errors --retry-delay 5 -o ndk.zip \
              https://dl.google.com/android/repository/android-ndk-r10e-linux-x86_64.zip
            unzip -q -o ndk.zip
            chmod +x android-ndk-r10e/ndk-build
          fi
          ~/android-ndk-r10e/ndk-build --version

      - name: 下载上游游戏源码
        run: |
          set -eo pipefail
          mkdir -p ~/upstream
          if [ ! -f ~/upstream/.ok ]; then
            rm -rf ~/upstream/NarutoSenki ~/upstream/src.tar.gz
            curl -fL --retry 8 --retry-all-errors --retry-delay 5 \
              --speed-time 60 --speed-limit 1000 \
              -o ~/upstream/src.tar.gz \
              https://codeload.github.com/LeaderOnePro/NarutoSenki/tar.gz/refs/tags/v1.22
            ls -l ~/upstream/src.tar.gz
            tar tzf ~/upstream/src.tar.gz > /dev/null
            mkdir -p ~/upstream/NarutoSenki
            tar xzf ~/upstream/src.tar.gz -C ~/upstream/NarutoSenki --strip-components=1
            test -f ~/upstream/NarutoSenki/Classes/GameLayer.cpp
            touch ~/upstream/.ok
          fi
          ls ~/upstream/NarutoSenki/Classes | wc -l

      - name: 组装工程
        run: |
          set -eo pipefail
          rm -rf work && mkdir -p work
          cp -r ~/upstream/NarutoSenki/Classes  work/Classes
          cp -r ~/upstream/NarutoSenki/Resources work/Resources
          cp -r proj.android work/proj.android
          ln -s ~/cocos2d-x-2.2.2 work/cocos2d-x-2.2.2
          find work/Classes -type f \( -name '*.cpp' -o -name '*.h' \) -print0 |
          while IFS= read -r -d '' f; do
            if ! iconv -f UTF-8 -t UTF-8 "$f" >/dev/null 2>&1; then
              iconv -f GBK -t UTF-8 "$f" -o "$f.tmp" && mv "$f.tmp" "$f"
            fi
          done
          find work/Classes -type f | wc -l

      - name: ndk-build
        id: ndk
        continue-on-error: true
        run: |
          cd work/proj.android
          set +e
          ~/android-ndk-r10e/ndk-build -j4 \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=./jni/Android.mk \
            NDK_APPLICATION_MK=./jni/Application.mk > ~/build.log 2>&1
          rc=$?
          echo "rc=$rc"
          tail -60 ~/build.log
          exit $rc

      - name: 回传编译日志
        if: always()
        run: |
          set +e
          BODY=$(tail -c 60000 ~/build.log | python3 -c 'import sys,json;print(json.dumps(sys.stdin.read()))')
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "{\"title\":\"build log ${{ github.run_number }}\",\"body\":$BODY}" \
            https://api.github.com/repos/${{ github.repository }}/issues

      - name: 收集产物
        run: |
          set -eo pipefail
          mkdir -p app/src/main/libs/armeabi-v7a app/src/main/assets app/src/main/cocos2dx-java
          cp work/proj.android/libs/armeabi-v7a/*.so app/src/main/libs/armeabi-v7a/
          cp -r work/cocos2d-x-2.2.2/cocos2dx/platform/android/java/src/* app/src/main/cocos2dx-java/ || true
          cp -r work/Resources/* app/src/main/assets/
          ls -la app/src/main/libs/armeabi-v7a

      - name: 安装 Gradle
        run: |
          set -eo pipefail
          curl -fL --retry 5 --retry-all-errors -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q -o gradle.zip -d ~/
          echo "$HOME/gradle-8.7/bin" >> $GITHUB_PATH

      - name: 打包 APK
        run: |
          set -eo pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tail -80
          find app/build/outputs -name '*.apk' -exec ls -lh {} \;

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
