name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: 缓存工具链
        uses: actions/cache@v4
        with:
          path: |
            ~/cocos2d-x-2.2.2
            ~/android-ndk-r10e
            ~/thirdparty
          key: ns-toolchain-v4

      - name: 日志初始化
        run: echo "=== build start ===" > ~/build.log

      - name: cocos2d-x 2.2.2
        run: |
          cd ~
          if [ ! -d cocos2d-x-2.2.2/cocos2dx ]; then
            curl -fL --retry 5 --retry-all-errors -o cocos.zip \
              https://github.com/LeaderOnePro/NarutoSenki/releases/download/v1.22/cocos2d-x-2.2.2.zip
            unzip -q -o cocos.zip
          fi
          test -d ~/cocos2d-x-2.2.2/cocos2dx

      - name: NDK r10e
        run: |
          cd ~
          if [ ! -x android-ndk-r10e/ndk-build ]; then
            curl -fL --retry 5 --retry-all-errors -o ndk.zip \
              https://dl.google.com/android/repository/android-ndk-r10e-linux-x86_64.zip
            unzip -q -o ndk.zip
            chmod +x android-ndk-r10e/ndk-build
          fi
          ~/android-ndk-r10e/ndk-build --version | head -2

      - name: 自制 arm64 预编译第三方库
        run: |
          set -x
          mkdir -p ~/thirdparty && cd ~/thirdparty
          P=~/cocos2d-x-2.2.2/cocos2dx/platform/third_party/android/prebuilt
          NDK=~/android-ndk-r10e
          export PATH=$NDK/toolchains/arm-linux-androideabi-4.9/prebuilt/linux-x86_64/bin:$PATH

          # ---------- zlib ----------
          if [ ! -f zlib-arm64/libz.a ]; then
            curl -fL --retry 3 -o zlib.tar.gz https://zlib.net/fossils/zlib-1.2.13.tar.gz || \
            curl -fL --retry 3 -o zlib.tar.gz https://github.com/madler/zlib/releases/download/v1.2.13/zlib-1.2.13.tar.gz
            tar xzf zlib.tar.gz
            cd zlib-1.2.13
            CC=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang
            # NDK r10e 没有 llvm，用 gcc
            CC=$NDK/toolchains/aarch64-linux-android-4.9/prebuilt/linux-x86_64/bin/aarch64-linux-android-gcc
            CHOST=aarch64-linux-android CFLAGS="--sysroot=$NDK/platforms/android-21/arch-arm64" \
              ./configure --static --prefix=$HOME/thirdparty/zlib-arm64
            make -j4 && make install
            cd ..
          fi
          ls ~/thirdparty/zlib-arm64/lib 2>/dev/null | head

      - name: 上报阶段1日志
        if: always()
        run: |
          { echo "@@@ ZLIB 构建"; tail -30 ~/build.log; } 
          tail -c 4000 ~/build.log > /tmp/t.log
          BODY=$(python3 -c 'import json;print(json.dumps(open("/tmp/t.log",errors="replace").read()))')
          curl -sS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" \
            -d "{\"title\":\"log ${{ github.run_number }}-1\",\"body\":$BODY}" \
            https://api.github.com/repos/${{ github.repository }}/issues || true
