name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/cocos2d-x-2.2.2
            ~/android-ndk-r10e
            ~/tb
          key: ns-v8

      - name: 初始化
        run: |
          L=~/build.log; echo "=== start ===" > $L
          cd ~
          if [ ! -d cocos2d-x-2.2.2/cocos2dx ]; then
            curl -fL --retry 5 --retry-all-errors -o cocos.zip \
              https://github.com/LeaderOnePro/NarutoSenki/releases/download/v1.22/cocos2d-x-2.2.2.zip
            unzip -q -o cocos.zip
          fi
          if [ ! -x android-ndk-r10e/ndk-build ]; then
            curl -fL --retry 5 --retry-all-errors -o ndk.zip \
              https://dl.google.com/android/repository/android-ndk-r10e-linux-x86_64.zip
            unzip -q -o ndk.zip; chmod +x android-ndk-r10e/ndk-build
          fi
          echo init-ok >> $L

      - name: 编译 arm64 库
        continue-on-error: true
        run: |
          set +e
          L=~/build.log
          NDK=~/android-ndk-r10e
          TC=$NDK/toolchains/aarch64-linux-android-4.9/prebuilt/linux-x86_64/bin
          export CC=$TC/aarch64-linux-android-gcc
          export AR=$TC/aarch64-linux-android-ar
          export RANLIB=$TC/aarch64-linux-android-ranlib
          export CHOST=aarch64-linux-android
          SR="--sysroot=$NDK/platforms/android-21/arch-arm64"
          export CFLAGS="-O2 -fPIC $SR"
          export LDFLAGS="$SR"
          mkdir -p ~/tb && cd ~/tb

          echo "@@@ libpng" >> $L
          if [ ! -f png/lib/libpng.a ]; then
            rm -rf libpng-1.6.40 png
            [ -f p.tgz ] || curl -fsSL --retry 3 -o p.tgz https://github.com/pnggroup/libpng/archive/refs/tags/v1.6.40.tar.gz
            tar xzf p.tgz; cd libpng-1.6.40
            # 绕过与系统 zlib 头版本号的编译期检查
            sed -i 's|^#  error ZLIB_VERNUM != PNG_ZLIB_VERNUM|#  undef  ZLIB_VERNUM_DUMMY_CHECK|' pngpriv.h
            ./configure --host=aarch64-linux-android --enable-static --disable-shared \
              --prefix=$HOME/tb/png \
              CPPFLAGS="-I$HOME/tb/zlib/include" \
              LDFLAGS="-L$HOME/tb/zlib/lib $SR" > ~/p.log 2>&1
            make -j4 >> ~/p.log 2>&1 && make install >> ~/p.log 2>&1
            cd ..; grep -E "error:" ~/p.log | head -5 >> $L
          fi
          echo "png -> $(ls png/lib 2>/dev/null | tr '\n' ' ')" >> $L

          echo "@@@ libjpeg" >> $L
          if [ ! -f jpg/lib/libjpeg.a ]; then
            rm -rf libjpeg-turbo-1.5.3 jpg jb
            [ -f j.tgz ] || curl -fsSL --retry 3 -o j.tgz https://github.com/libjpeg-turbo/libjpeg-turbo/archive/refs/tags/1.5.3.tar.gz
            tar xzf j.tgz
            mkdir -p jb && cd jb
            cmake ../libjpeg-turbo-1.5.3 \
              -DCMAKE_C_COMPILER=$CC -DCMAKE_AR=$AR -DCMAKE_RANLIB=$RANLIB \
              -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
              -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
              -DCMAKE_C_FLAGS="$CFLAGS" -DCMAKE_EXE_LINKER_FLAGS="$LDFLAGS" \
              -DCMAKE_INSTALL_PREFIX=$HOME/tb/jpg \
              -DENABLE_SHARED=OFF -DENABLE_STATIC=ON -DWITH_TURBOJPEG=OFF \
              -DWITH_JAVA=OFF -DWITH_SIMD=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
              > ~/j.log 2>&1
            echo "cmake_rc=$?" >> $L
            make -j4 >> ~/j.log 2>&1
            echo "make_rc=$?" >> $L
            make install >> ~/j.log 2>&1
            echo "install_rc=$?" >> $L
            cd ..
            tail -25 ~/j.log >> $L
          fi
          echo "jpeg -> $(ls jpg/lib 2>/dev/null | tr '\n' ' ')" >> $L

          echo "@@@ install" >> $L
          P=~/cocos2d-x-2.2.2/cocos2dx/platform/third_party/android/prebuilt
          mkdir -p $P/libpng/libs/arm64-v8a $P/libjpeg/libs/arm64-v8a
          cp ~/tb/png/lib/libpng*.a $P/libpng/libs/arm64-v8a/ 2>/dev/null
          cp ~/tb/jpg/lib/libjpeg.a  $P/libjpeg/libs/arm64-v8a/ 2>/dev/null
          cp ~/tb/zlib/lib/libz.a    $P/libpng/libs/arm64-v8a/ 2>/dev/null
          ls $P/libpng/libs/arm64-v8a $P/libjpeg/libs/arm64-v8a >> $L 2>&1

          echo "@@@ 去掉 tiff/webp" >> $L
          sed -i '/cocos_libtiff_static/d;/cocos_libwebp_static/d;/import-module,libtiff/d;/import-module,libwebp/d' \
            ~/cocos2d-x-2.2.2/cocos2dx/Android.mk
          grep -n "STATIC_LIBRARIES\|import-module" ~/cocos2d-x-2.2.2/cocos2dx/Android.mk >> $L
          exit 0

      - name: 组装
        run: |
          L=~/build.log
          echo "@@@ assemble" >> $L
          mkdir -p ~/upstream
          if [ ! -f ~/upstream/.ok ]; then
            curl -fL --retry 8 --retry-all-errors -o ~/upstream/src.tar.gz \
              https://codeload.github.com/LeaderOnePro/NarutoSenki/tar.gz/refs/tags/v1.22
            mkdir -p ~/upstream/NarutoSenki
            tar xzf ~/upstream/src.tar.gz -C ~/upstream/NarutoSenki --strip-components=1
            touch ~/upstream/.ok
          fi
          rm -rf work && mkdir -p work
          cp -r ~/upstream/NarutoSenki/Classes work/Classes
          cp -r ~/upstream/NarutoSenki/Resources work/Resources
          cp -r proj.android work/proj.android
          ln -s ~/cocos2d-x-2.2.2 work/cocos2d-x-2.2.2
          find work/Classes -type f \( -name '*.cpp' -o -name '*.h' \) -print0 |
          while IFS= read -r -d '' f; do
            iconv -f UTF-8 -t UTF-8 "$f" >/dev/null 2>&1 || { iconv -f GBK -t UTF-8 "$f" -o "$f.tmp" && mv "$f.tmp" "$f"; }
          done
          echo "classes=$(find work/Classes -type f | wc -l)" >> $L

      - name: ndk-build
        run: |
          L=~/build.log
          cd work/proj.android
          export NDK_MODULE_PATH=$HOME/cocos2d-x-2.2.2:$HOME/cocos2d-x-2.2.2/cocos2dx/platform/third_party/android/prebuilt
          ~/android-ndk-r10e/ndk-build -j4 NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=./jni/Android.mk NDK_APPLICATION_MK=./jni/Application.mk \
            > ~/ndk.log 2>&1
          echo "ndk_rc=$?" >> $L
          grep -E "error:|undefined reference|\*\*\*|Install *:" ~/ndk.log | head -40 >> $L
          ls -la libs/arm64-v8a/ >> $L 2>&1
          exit 0

      - name: 打包
        run: |
          L=~/build.log
          echo "@@@ package" >> $L
          mkdir -p app/src/main/libs/arm64-v8a app/src/main/assets app/src/main/cocos2dx-java
          cp work/proj.android/libs/arm64-v8a/*.so app/src/main/libs/arm64-v8a/ 2>/dev/null
          ls -la app/src/main/libs/arm64-v8a >> $L 2>&1
          cp -r ~/cocos2d-x-2.2.2/cocos2dx/platform/android/java/src/. app/src/main/cocos2dx-java/ || true
          find app/src/main/cocos2dx-java -name '*.java' -print0 | xargs -0 sed -i \
            -e 's/FloatMath\.ceil(/(float)Math.ceil(/g' \
            -e 's/FloatMath\.floor(/(float)Math.floor(/g' \
            -e 's/FloatMath\.sqrt(/(float)Math.sqrt(/g' \
            -e 's/^import android\.util\.FloatMath;//' || true
          cp -r work/Resources/. app/src/main/assets/ || true
          echo "assets=$(du -sh app/src/main/assets | cut -f1)" >> $L
          curl -fL --retry 5 -o ~/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q -o ~/gradle.zip -d ~/
          export PATH=$HOME/gradle-8.7/bin:$PATH
          gradle :app:assembleRelease --no-daemon > ~/g.log 2>&1
          echo "gradle_rc=$?" >> $L
          grep -E "error:|FAILURE|What went wrong|BUILD" ~/g.log | head -20 >> $L
          find app/build/outputs -name '*.apk' -exec ls -lh {} \; >> $L 2>&1
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: 发布
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.22-arm64-${{ github.run_number }}
          name: 火影战记 arm64 #${{ github.run_number }}
          body: arm64 自建库
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: false

      - name: 上报
        if: always()
        run: |
          { head -c 1200 ~/build.log; echo; echo "......"; tail -c 32000 ~/build.log; } > /tmp/t.log
          BODY=$(python3 -c 'import json;print(json.dumps(open("/tmp/t.log",errors="replace").read()))')
          curl -sS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" \
            -d "{\"title\":\"log ${{ github.run_number }}\",\"body\":$BODY}" \
            https://api.github.com/repos/${{ github.repository }}/issues || true
