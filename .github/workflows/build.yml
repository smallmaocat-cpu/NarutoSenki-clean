name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Cache cocos + ndk
        uses: actions/cache@v4
        with:
          path: |
            ~/cocos2d-x-2.2.2
            ~/android-ndk-r10e
          key: ns-toolchain-v3

      - name: 下载 cocos2d-x 2.2.2
        run: |
          cd ~
          if [ ! -d cocos2d-x-2.2.2/cocos2dx ]; then
            curl -fL --retry 5 --retry-all-errors -o cocos.zip \
              https://github.com/LeaderOnePro/NarutoSenki/releases/download/v1.22/cocos2d-x-2.2.2.zip
            unzip -q -o cocos.zip
          fi
          test -d ~/cocos2d-x-2.2.2/cocos2dx && echo cocos-ok

      - name: 下载 NDK r10e
        run: |
          cd ~
          if [ ! -x android-ndk-r10e/ndk-build ]; then
            curl -fL --retry 5 --retry-all-errors -o ndk.zip \
              https://dl.google.com/android/repository/android-ndk-r10e-linux-x86_64.zip
            unzip -q -o ndk.zip
            chmod +x android-ndk-r10e/ndk-build
          fi
          ~/android-ndk-r10e/ndk-build --version

      - name: 下载上游游戏源码
        run: |
          mkdir -p ~/upstream
          if [ ! -f ~/upstream/.ok ]; then
            rm -rf ~/upstream/NarutoSenki ~/upstream/src.tar.gz
            curl -fL --retry 8 --retry-all-errors -o ~/upstream/src.tar.gz \
              https://codeload.github.com/LeaderOnePro/NarutoSenki/tar.gz/refs/tags/v1.22
            tar tzf ~/upstream/src.tar.gz > /dev/null
            mkdir -p ~/upstream/NarutoSenki
            tar xzf ~/upstream/src.tar.gz -C ~/upstream/NarutoSenki --strip-components=1
            test -f ~/upstream/NarutoSenki/Classes/GameLayer.cpp
            touch ~/upstream/.ok
          fi
          ls ~/upstream/NarutoSenki/Classes | wc -l

      - name: 组装工程
        run: |
          rm -rf work && mkdir -p work
          cp -r ~/upstream/NarutoSenki/Classes  work/Classes
          cp -r ~/upstream/NarutoSenki/Resources work/Resources
          cp -r proj.android work/proj.android
          ln -s ~/cocos2d-x-2.2.2 work/cocos2d-x-2.2.2
          find work/Classes -type f \( -name '*.cpp' -o -name '*.h' \) -print0 |
          while IFS= read -r -d '' f; do
            if ! iconv -f UTF-8 -t UTF-8 "$f" >/dev/null 2>&1; then
              iconv -f GBK -t UTF-8 "$f" -o "$f.tmp" && mv "$f.tmp" "$f"
            fi
          done
          find work/Classes -type f | wc -l

      - name: ndk-build
        continue-on-error: true
        run: |
          cd work/proj.android
          export NDK_MODULE_PATH=$HOME/cocos2d-x-2.2.2:$HOME/cocos2d-x-2.2.2/cocos2dx/platform/third_party/android/prebuilt
          set +e
          ~/android-ndk-r10e/ndk-build -j4 \
            NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./jni/Android.mk \
            NDK_APPLICATION_MK=./jni/Application.mk > ~/build.log 2>&1
          echo "ndk_rc=$?"
          grep -E "(error|Error|Install)" ~/build.log | tail -15
          echo "---"

      - name: 收集产物
        continue-on-error: true
        run: |
          mkdir -p app/src/main/libs/armeabi-v7a app/src/main/assets
          echo "=== so ===" | tee -a ~/build.log
          find work -name '*.so' | tee -a ~/build.log
          find work -name '*.so' -exec cp -t app/src/main/libs/armeabi-v7a/ {} + || true
          ls -la app/src/main/libs/armeabi-v7a | tee -a ~/build.log
          echo "=== java ===" | tee -a ~/build.log
          mkdir -p app/src/main/cocos2dx-java
          cp -r ~/cocos2d-x-2.2.2/cocos2dx/platform/android/java/src/. app/src/main/cocos2dx-java/ || true
          find app/src/main/cocos2dx-java -name '*.java' | head -20 | tee -a ~/build.log
          echo "=== assets ===" | tee -a ~/build.log
          cp -r work/Resources/. app/src/main/assets/ || true
          du -sh app/src/main/assets | tee -a ~/build.log
          exit 0

      - name: 安装 Gradle
        run: |
          curl -fL --retry 5 --retry-all-errors -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q -o gradle.zip -d ~/
          echo "$HOME/gradle-8.7/bin" >> $GITHUB_PATH

      - name: 打包 APK
        continue-on-error: true
        run: |
          set +e
          gradle :app:assembleRelease --no-daemon --stacktrace > ~/gradle.log 2>&1
          echo "gradle_rc=$?"
          grep -E "(error:|FAILURE|What went wrong|Caused by|BUILD)" ~/gradle.log | head -30
          find app/build/outputs -name '*.apk' -exec ls -lh {} \;
          cat ~/gradle.log >> ~/build.log
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: 回传日志
        if: always()
        run: |
          tail -c 55000 ~/build.log > /tmp/tail.log 2>/dev/null || true
          BODY=$(python3 -c 'import json,sys;print(json.dumps(open("/tmp/tail.log",errors="replace").read()))')
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "{\"title\":\"build log ${{ github.run_number }}\",\"body\":$BODY}" \
            https://api.github.com/repos/${{ github.repository }}/issues || true
